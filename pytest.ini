[pytest]
testpaths = tests
addopts = -p no:cacheprovider --strict-markers -W ignore::DeprecationWarning
markers =
    unit: lógica de dominio pura, sin BD ni HTTP
    integration: API + BD (SQLite temporal migrada con Alembic)
    security: pruebas de seguridad (CSRF, escalamiento, aislamiento, tokens, sesiones)
    postgres: requiere TEST_DATABASE_URL (PostgreSQL de pruebas independiente)
